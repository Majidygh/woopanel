name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build plugin package
        run: |
          mkdir -p dist/woopanel
          rsync -av --exclude='dist' --exclude='.git' --exclude='.github' --exclude='scratch*' --exclude='tools/render_previews.py' --exclude='*.zip' . dist/woopanel/
          cd dist
          zip -r "woopanel-${{ github.ref_name }}.zip" woopanel

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/woopanel-${{ github.ref_name }}.zip
          generate_release_notes: true
